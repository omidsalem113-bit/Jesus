<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>پیدایش مسیحیت | The Origin of Christianity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf3ea;--card:#fdfbf8;--ink:#2b2724;--soft:#8a7b6c;--line:#8b7765;--accent:#9c8671;--shadow:rgba(120,95,70,.18)}
[data-theme="dark"]{--bg:#1d1a17;--card:#27231f;--ink:#f1e9df;--soft:#b3a393;--line:#a8927d;--accent:#c4ab92;--shadow:rgba(0,0,0,.5)}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{overflow-x:hidden}
.entry,.panel{min-width:0}
body{background:var(--bg);color:var(--ink);font-family:"Vazirmatn",Tahoma,sans-serif;line-height:1.9;transition:background .3s,color .3s}
body[dir=ltr],[dir=ltr] body{font-family:"Vazirmatn",Georgia,serif}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.wrap{max-width:460px;margin:0 auto;padding:20px 22px 56px}
.top{display:flex;justify-content:flex-start;align-items:center;gap:14px;direction:ltr;font-size:15px}
.langsw{width:72px;height:30px;border-radius:15px;border:0;background:var(--line);position:relative;display:flex;padding:0;cursor:pointer;font:inherit;font-size:13px;color:#fff}
.langsw::before{content:"";position:absolute;top:3px;left:3px;width:33px;height:24px;border-radius:12px;background:var(--card);transition:transform .25s}
html[lang=en] .langsw::before{transform:translateX(33px)}
.langsw span{flex:1;z-index:1;display:flex;align-items:center;justify-content:center;transition:color .25s}
html[lang=fa] .langsw span:first-child,html[lang=en] .langsw span:last-child{color:var(--ink);font-weight:700}
.theme{width:56px;height:30px;border-radius:15px;border:0;background:var(--line);position:relative;cursor:pointer;display:flex;align-items:center;justify-content:space-between;padding:0 7px;color:#fff}
.theme::before{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--card);transition:transform .25s}
[data-theme="dark"] .theme::before{transform:translateX(26px)}
.theme svg{width:15px;height:15px;position:relative;z-index:1}
.top{justify-content:flex-end}
[dir=ltr] .top{justify-content:flex-end}
.logo{display:block;width:190px;height:190px;margin:18px auto 14px;border-radius:50%;object-fit:cover}
h1{font-size:34px;text-align:center;font-weight:700;line-height:1.5}
.tag{text-align:center;color:var(--soft);font-size:14.5px;margin:6px 0 34px}
.cards{display:grid;gap:22px}
.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:0;text-align:center;box-shadow:0 0 0 7px color-mix(in srgb,var(--card) 70%,transparent),0 18px 30px -12px var(--shadow),0 5px 0 -1px var(--card),0 6px 0 -1px var(--line);transition:transform .2s}
.card:hover{transform:translateY(-2px)}
.hd{all:unset;box-sizing:border-box;display:block;width:100%;padding:14px 18px 10px;cursor:pointer;text-align:center}
.hd:focus-visible{outline:2px solid var(--accent);outline-offset:-4px;border-radius:22px}
.panel{padding:4px 16px 16px;text-align:start;border-top:1px dashed var(--line);margin:0 14px;padding-inline:0;padding-top:14px}
.card[data-open] .hd svg{opacity:.45}
.card h2{font-size:20px;font-weight:700;margin-bottom:2px}
.card svg{width:100%;height:68px}
.s{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.a{fill:none;stroke:var(--accent);stroke-width:1.4;stroke-linecap:round}
.f{fill:var(--accent);stroke:none}
.back{display:inline-block;margin:26px 0 8px;color:var(--soft);font-size:15px}
.page h1{font-size:28px;margin:10px 0 6px}
.page .tag{margin-bottom:24px}
.entry{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin-bottom:14px}
.entry h3{font-size:17px;font-weight:500}
.entry p{color:var(--soft);font-size:14.5px}
.entry audio{width:100%;margin-top:10px}
.prose p{margin-bottom:12px;font-size:15.5px;line-height:2.1;text-align:justify}
.prose p:last-child{margin-bottom:0;font-weight:500}
.ql{list-style:none;padding:0;display:grid;gap:10px}
.ql li{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-size:15.5px;line-height:1.9}

/* ===== پخش‌کننده ===== */
.pl{margin-top:14px;direction:ltr}
.pl-bar{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--soft);font-variant-numeric:tabular-nums}
.pl-bar span{min-width:34px;text-align:center}
.pl input[type=range]{flex:1;min-width:0;height:22px;margin:0;background:none;-webkit-appearance:none;appearance:none;cursor:pointer;--p:0%}
.pl input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(to right,var(--accent) var(--p),var(--line) var(--p))}
.pl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--accent);margin-top:-5px;border:0}
.pl input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--line)}
.pl input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--accent)}
.pl input[type=range]::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:var(--accent)}
.pl-ctl{display:grid;grid-template-columns:1fr auto auto auto 1fr;align-items:center;gap:8px;margin-top:10px}
.pl-ctl .spd{justify-self:start}
.pl button{border:0;background:none;color:var(--ink);cursor:pointer;display:grid;place-items:center;padding:0;transition:transform .15s,opacity .2s}
.pl button:active{transform:scale(.92)}
.pl svg{display:block}
.pl .pp{width:54px;height:54px;border-radius:50%;background:var(--accent);color:var(--card)}
.pl .pp svg{width:24px;height:24px;fill:currentColor;stroke:currentColor;stroke-width:1.2;stroke-linejoin:round}
.pl .pp{box-shadow:0 4px 14px -4px var(--accent)}
.pl .sk{width:42px;height:42px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.pl .sk svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.pl .sk .fl{fill:currentColor;stroke:none}
.pl .spd{height:30px;padding:0 9px;border-radius:15px;border:1px solid var(--line);font:inherit;font-size:13px;font-weight:700}
#p-mindset .prose p:first-child{font-size:13.5px;color:var(--soft);margin-bottom:10px}
#p-mindset .prose p:last-child{font-weight:400}
[hidden]{display:none!important}

/* ===== پویانمایی ===== */
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fadein{from{opacity:0}}
@keyframes float{50%{transform:translateY(-6px)}}
@keyframes drift{50%{transform:translate(4px,-5px);opacity:.6}}
@keyframes pulse{50%{transform:scale(1.18)}}
@keyframes wave{from{transform:scaleY(.45)}to{transform:scaleY(1.08)}}
.logo{animation:fadein .8s both}
h1{animation:rise .5s .1s both}
.tag{animation:rise .5s .15s both}
.tag+.tag{animation-delay:.2s}
.cards .card:nth-child(1){animation:rise .5s .25s both}
.cards .card:nth-child(2){animation:rise .5s .32s both}
.cards .card:nth-child(3){animation:rise .5s .39s both}
.top{animation:fadein .8s both}
.card,.entry,.ql li{transition:background .3s,border-color .3s,transform .25s,box-shadow .3s}
.card:active{transform:scale(.985)}
.hd svg{transition:transform .35s,opacity .3s}
.hd:hover svg{transform:scale(1.05)}
.hd::after{content:"";display:block;width:8px;height:8px;margin:0 auto 2px;border-right:1.6px solid var(--accent);border-bottom:1.6px solid var(--accent);transform:rotate(45deg);transition:transform .35s}
.card[data-open] .hd::after{transform:rotate(225deg) translate(-2px,-2px)}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}

</style>
</head>

fa:{m1:"پیدایش مسیحیت - ۱۴۰۵/۰۸/۱۴",m2:"مسیحیت جنبشی بود که با عیسی شروع و با همت خادمانی نظیر یوحنا، پطرس، پولس ،آمبروسیوس، هیرونوموس، گرگوریوس، آگوستینوس، پلاگیوس، ترتولیانوس و... نهادینه شد و در سرتا سر جهان گسترش یافت.",m3:"این دین در طول عمر طویل خود پستی و بلندی‌های بسیار دیده. از آزار و شکنجه مؤمنان زلال‌دل توسط پاگانوس‌ها گرفته تا سوزاندن قابله‌های دلسوز توسط کلیسای فاسد در قرون وسطی. از عیسی، آفریده خدا گرفته تا عیسی هستی یافته از خدای پدر. از پاکی فطری پلاگیوسی گرفته تا گناه جبلی آگوستینوسی. همچنین از انجیل وحی شده به عیسی گرفته تا اناجیل گونه‌گون لوقا، متی، مرقس، یوحنا و...",m4:"با وجود تمامی این موارد تقدیر الهی بر آن بود که عیسی ناصری از زنی باکره و عزرا چشم به جهان گشوده و پایه گذار مذهبی باشد که امروز روز پس از حدود ۲۰۰۰ سال بیش از ۲ میلیارد پیرو در سراسر جهان داشته باشد.",i1:"زندگی شخصی عیسی بنا بر روایات عهد جدید و قرآن",i2:"تاثیر پولس بر مسیحیت و خطابه معروف او در میدان آکروپولیس",i3:"تحقیق در رابطه با مسیحیت",i4:"بربر ها چه کسانی بودند و چرا به آنها بربر گفته می‌شد؟",i5:"تحقیق گسترده‌تر در رابطه با شورای نیقیه و جناح های آریوسی و آتاناسوسی",i6:"پژوهش در رابطه با مانی پیامبر ایرانی و پیروان او",title:"«پیدایش مسیحیت»",tag:"",author:"نویسنده: دان ناردو",c1:"نگاه من",c2:"ایده‌ها و سؤال‌ها",c3:"پادکست",back:"→ بازگشت",

 fwd:'<svg viewBox="0 0 24 24"><path d="M18.93 9A8 8 0 1 1 14.74 5.48"/><path class="fl" d="M13.32 7.94L17.75 6.57L15.22 2.68Z"/><text x="12" y="15.6" text-anchor="middle" font-size="7.2" font-weight="700" stroke="none" fill="currentColor">10</text></svg>',
 back:'<svg viewBox="0 0 24 24"><g transform="matrix(-1 0 0 1 24 0)"><path d="M18.93 9A8 8 0 1 1 14.74 5.48"/><path class="fl" d="M13.32 7.94L17.75 6.57L15.22 2.68Z"/></g><text x="12" y="15.6" text-anchor="middle" font-size="7.2" font-weight="700" stroke="none" fill="currentColor">10</text></svg>'
};
const RATES=[1,1.25,1.5,2,0.75];
const fmt=t=>{if(!isFinite(t))return"0:00";const m=Math.floor(t/60),s=Math.floor(t%60);return m+":"+String(s).padStart(2,"0")};
const PLAYERS=[];
function buildPlayer(src){
  const a=new Audio();PLAYERS.push(a);a.preload="metadata";a.src=src;
  const w=document.createElement("div");w.className="pl";
  w.innerHTML='<div class="pl-bar"><span class="cur">0:00</span><input type="range" min="0" max="1000" value="0" aria-label="Seek"><span class="dur">0:00</span></div><div class="pl-ctl"><button class="spd" title="Speed">1×</button><button class="sk" title="-10s" aria-label="Back 10 seconds">'+IC.back+'</button><button class="pp" aria-label="Play">'+IC.play+'</button><button class="sk" title="+10s" aria-label="Forward 10 seconds">'+IC.fwd+'</button><span class="sp"></span></div>';
  const q=x=>w.querySelector(x),bar=q("input"),pp=q(".pp"),sk=w.querySelectorAll(".sk"),spd=q(".spd");let ri=0;
  const paint=()=>{const p=a.duration?a.currentTime/a.duration*100:0;bar.value=p*10;bar.style.setProperty("--p",p+"%");q(".cur").textContent=fmt(a.currentTime)};
  a.onloadedmetadata=()=>{q(".dur").textContent=fmt(a.duration)};
  a.ontimeupdate=paint;
  a.onplay=()=>{PLAYERS.forEach(x=>{if(x!==a)x.pause()});pp.innerHTML=IC.pause;pp.setAttribute("aria-label","Pause")};
  a.onpause=()=>{pp.innerHTML=IC.play;pp.setAttribute("aria-label","Play")};
  pp.onclick=()=>a.paused?a.play():a.pause();
  sk[0].onclick=()=>{a.currentTime=Math.max(0,a.currentTime-10)};
  sk[1].onclick=()=>{a.currentTime=Math.min(a.duration||0,a.currentTime+10)};
  spd.onclick=()=>{ri=(ri+1)%RATES.length;a.playbackRate=RATES[ri];spd.textContent=RATES[ri]+"×"};
  bar.oninput=()=>{if(a.duration){a.currentTime=bar.value/1000*a.duration;paint()}};
  return w;
}
function renderEps(){
  const eps=$("#eps"),en=root.lang==="en";
  if(!eps.children.length)EPISODES.forEach(e=>{
    const d=document.createElement("div");d.className="entry";
    d.append(document.createElement("h3"),document.createElement("p"),buildPlayer(e.src));eps.append(d);
  });
  EPISODES.forEach((e,i)=>{
    const d=eps.children[i],p=d.querySelector("p");
    d.querySelector("h3").textContent=en?(e.titleEn||e.title):e.title;
    p.textContent=en?(e.descEn||e.desc):e.desc;p.hidden=!p.textContent;
  });
}
let l="fa",t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";
try{l=localStorage.getItem("lang")||l;t=localStorage.getItem("theme")||t}catch(e){}
setTheme(t);setLang(l);
